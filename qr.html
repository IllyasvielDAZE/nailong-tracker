<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打印奶龙二维码</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;color:#242424;background:#f3f5f7;margin:0;padding:25px}.page{max-width:540px;margin:0 auto;background:#fff;padding:25px;border-radius:16px}label{display:block;margin:12px 0 7px;font-size:14px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px}button{padding:11px 17px;background:#a6192e;color:white;border:0;border-radius:8px;margin-top:10px;cursor:pointer}.paper{text-align:center;padding:24px;border:2px dashed #bbb;margin-top:25px;border-radius:16px}.paper h1{font-size:27px;margin-bottom:8px}.paper p{font-size:17px}.code{display:flex;justify-content:center;margin:24px auto}small{color:#666}@media print{body{background:white;padding:0}.page{max-width:none;padding:0}.controls{display:none}.paper{border:none;margin:0;padding:40px}.code img,.code canvas{width:260px!important;height:260px!important}}</style></head><body><div class="page"><div class="controls"><h2>🦖 奶龙二维码制作</h2><p>网页部署完成后，把网站地址填在这里，自动生成扫码上报二维码。</p><label for="url">公开网站 URL</label><input type="url" id="url" placeholder="https://你的用户名.github.io/nailong-tracker/" /><button id="make" type="button">生成二维码</button> <button type="button" onclick="window.print()">打印贴纸</button></div><div class="paper"><h1>🦖 Where's Nailong?</h1><p>找到我了吗？扫码记录我的足迹！</p><div class="code" id="code"></div><p>Scan to check in • 扫码上报位置</p><small>仅在奶龙旁边上报 · 需要同意手机定位</small></div></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
document.getElementById('make').addEventListener('click',()=>{const input=document.getElementById('url').value.trim();try{const u=new URL(input);if(u.protocol!=='https:')throw Error('HTTPS only');u.searchParams.set('report','1');document.getElementById('code').innerHTML='';new QRCode(document.getElementById('code'),{text:u.href,width:230,height:230,correctLevel:QRCode.CorrectLevel.H});}catch(e){alert('请输入部署完成的 HTTPS 网站地址。')}});
</script></body></html>
